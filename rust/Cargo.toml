# The Rust half of the package. `HLD.md` rules that Rust programs use this as an ordinary Rust
# library, not only as the engine behind the JavaScript package, so the core crate is the product
# and every binding is a wrapper over it.
[workspace]
resolver = "3"
members = [
  "crates/boundary",
  "crates/conformance",
  "crates/native",
  "crates/partial-json-repair",
  "crates/wasm",
]

[workspace.package]
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"

# Central policy. A member without `[lints] workspace = true` inherits NONE of this, which is the
# quiet way a lint gate ends up covering one crate out of two.
[workspace.lints.rust]
# Bindings generated by N-API contain their own narrowly scoped allowance. Product and boundary
# crates raise this to `forbid` at their roots; `deny` still rejects authored unsafe in wrappers.
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
# The core is `no_std` plus `alloc`; these catch a `std` path arriving through a dependency's
# default features rather than through an import anyone would notice in review.
std_instead_of_core = "deny"
alloc_instead_of_core = "deny"

# Tests assert values and state transitions rather than debug-symbol output. Omitting symbols and
# using the edit lane's bounded target directory keep source checks inside the commit hook's latency
# budget without weakening the test lane.
[profile.test]
debug = 0
